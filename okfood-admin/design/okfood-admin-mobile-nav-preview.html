<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手机导航预览 · 水果旁边写上模块名</title>
  <style>
    :root {
      --peach: #e8927c;
      --peach-deep: #dd7f68;
      --ink: #1d1f21;
      --muted: #5c6670;
      --line: rgba(0, 0, 0, 0.06);
      --card: rgba(255, 255, 255, 0.86);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(232, 146, 124, 0.28), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, rgba(140, 170, 255, 0.18), transparent 55%),
        #f4efe9;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    .page-head h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .page-head p {
      margin: 0;
      max-width: 46rem;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .stage {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      margin-top: 22px;
      align-items: flex-start;
    }

    .col { width: 390px; }

    .col h2 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 700;
    }

    .col .hint {
      margin: 0 0 12px;
      min-height: 40px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .phone {
      position: relative;
      width: 390px;
      height: 760px;
      overflow: hidden;
      border: 10px solid #2a2422;
      border-radius: 36px;
      background: #f7f3ef;
      box-shadow:
        0 24px 50px rgba(80, 40, 20, 0.16),
        inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .mesh {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(280px 180px at 0% 0%, rgba(232, 146, 124, 0.35), transparent 70%),
        radial-gradient(220px 160px at 100% 8%, rgba(186, 176, 255, 0.28), transparent 70%);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    .top {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 12px 8px;
    }

    .logo {
      width: 32px;
      height: 32px;
      flex: none;
      border-radius: 10px;
      background:
        radial-gradient(circle at 30% 30%, #7eb6ff, #3b6dff 42%, transparent 43%),
        radial-gradient(circle at 70% 68%, #ffb199, #e07a62 46%, transparent 47%),
        #fff;
      box-shadow: 0 4px 10px rgba(80, 40, 30, 0.08);
    }

    .collapse-fake,
    .bell,
    .avatar {
      width: 32px;
      height: 32px;
      flex: none;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      box-shadow: 0 4px 12px rgba(80, 40, 30, 0.05);
    }

    .bell { position: relative; font-size: 15px; }
    .bell i {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: #ef5b4c;
      box-shadow: 0 0 0 2px #fff;
    }

    .clock {
      flex: none;
      text-align: right;
      line-height: 1.1;
    }
    .clock b {
      display: block;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .clock span {
      font-size: 10px;
      color: var(--muted);
    }

    .avatar {
      font-size: 13px;
      font-weight: 700;
      color: var(--peach-deep);
    }

    .tab-row {
      position: relative;
      z-index: 3;
      padding: 0 12px 8px;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(232, 146, 124, 0.45);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(232, 146, 124, 0.12);
    }
    .tab s {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: linear-gradient(#7eb6ff, #e8927c);
      text-decoration: none;
    }

    .body {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow: auto;
      padding: 4px 12px 24px;
    }
    .body::-webkit-scrollbar { width: 0; }

    .with-rail {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .rail {
      position: sticky;
      top: 0;
      width: 52px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 6px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 24px rgba(80, 40, 30, 0.06);
    }

    .rail .tile {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--tint, #fff);
    }
    .rail .tile.on {
      box-shadow: 0 0 0 2px var(--peach);
    }
    .rail svg, .tile svg, .mod svg { width: 26px; height: 26px; display: block; }

    .rail-note {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
      text-align: center;
    }

    .day {
      margin: 8px 4px 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .day b { color: var(--ink); font-size: 15px; }

    .card {
      margin-bottom: 12px;
      padding: 14px 14px 12px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 28px rgba(80, 50, 30, 0.05);
    }

    .card-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .meal {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 650;
    }
    .tools {
      display: flex;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .tools .loss { color: var(--peach-deep); font-weight: 650; }

    .kpi {
      margin: 12px 0 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .kpi strong {
      margin-left: 4px;
      color: var(--ink);
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .kpi em { font-style: normal; margin-left: 2px; }

    .bar-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .sold {
      height: 22px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: #e8927c;
      color: #fff;
      font-size: 11px;
      font-weight: 650;
    }
    .sold.soft { background: #5b8def; }

    .bar {
      display: flex;
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: #ece7e2;
    }
    .bar i { display: block; height: 100%; }
    .bar .a { background: #5b8def; }
    .bar .b { background: #f0b429; }
    .bar .c { background: #3cba8b; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }
    .legend li {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 58px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      color: var(--muted);
    }
    .legend b { color: var(--ink); font-size: 13px; }
    .dot { width: 7px; height: 7px; border-radius: 99px; }
    .dot.d { background: #5b8def; }
    .dot.p { background: #8b7ec8; }
    .dot.o { background: #f0b429; }
    .dot.r { background: #ef5b4c; }
    .dot.g { background: #3cba8b; }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .stat {
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
    }
    .stat span { display: block; font-size: 11px; color: var(--muted); }
    .stat b { font-size: 20px; letter-spacing: -0.03em; }
    .stat.warn b { color: #e07a3a; }
    .stat.down { background: #eef8f1; }
    .stat.down b { color: #1f9d62; }

    .mod {
      min-width: 0;
      flex: 1;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 4px;
      border: 1px solid rgba(232, 146, 124, 0.55);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(232, 146, 124, 0.14);
    }
    .mod .tile {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--tint, #fff);
      flex: none;
    }
    .mod .tile svg { width: 22px; height: 22px; }
    .mod .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mod .chev {
      margin-left: auto;
      width: 8px;
      height: 8px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: translateY(-2px) rotate(45deg);
      flex: none;
    }
    .mod.open {
      background: var(--peach);
      border-color: transparent;
      color: #fff;
    }
    .mod.open .chev { border-color: #fff; transform: translateY(2px) rotate(225deg); }
    .mod.open .tile { background: rgba(255, 255, 255, 0.92); }

    .scrim {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: rgba(40, 24, 18, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .phone.show-sheet .scrim { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 5;
      max-height: 78%;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 18px 40px rgba(60, 30, 20, 0.18);
      backdrop-filter: blur(16px);
      transform: translateY(110%);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .phone.show-sheet .sheet { transform: translateY(0); }

    .sheet-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 8px;
    }
    .handle {
      position: absolute;
      top: 7px;
      left: 50%;
      width: 36px;
      height: 4px;
      margin-left: -18px;
      border-radius: 99px;
      background: rgba(0, 0, 0, 0.12);
    }
    .sheet-h strong { font-size: 15px; }
    .sheet-h button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .sheet-list {
      overflow: auto;
      padding: 0 8px 12px;
    }
    .sheet-list::-webkit-scrollbar { width: 0; }

    .row, .child {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .row {
      height: 48px;
      padding: 0 8px;
      border-radius: 14px;
    }
    .row .tile {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--tint, #f6f3f0);
      flex: none;
    }
    .row .tile svg { width: 24px; height: 24px; }
    .row .label { font-size: 15px; font-weight: 650; }
    .row .subchev {
      margin-left: auto;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid #9aa3ab;
      border-bottom: 1.5px solid #9aa3ab;
      transform: rotate(-45deg);
    }
    .row.expanded .subchev { transform: rotate(45deg); }
    .row.current {
      background: var(--peach);
      color: #fff;
    }
    .row.current .tile { background: rgba(255, 255, 255, 0.92); }
    .row.current .subchev { border-color: #fff; }
    .row.parent-on {
      background: rgba(232, 146, 124, 0.14);
      color: #c45b42;
    }

    .kids { display: none; padding: 0 8px 6px 50px; }
    .kids.show { display: block; }
    .child {
      height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 14px;
    }
    .child.current {
      background: rgba(232, 146, 124, 0.16);
      color: #c45b42;
      font-weight: 700;
    }

    .placeholder {
      margin-top: 8px;
      padding: 28px 18px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #fff;
    }
    .placeholder .eyebrow {
      margin: 0 0 6px;
      color: var(--peach-deep);
      font-size: 12px;
      font-weight: 700;
    }
    .placeholder h3 { margin: 0 0 8px; font-size: 22px; }
    .placeholder p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-head">
      <h1>手机导航预览</h1>
      <p>上面这台是手机上的做法：没有左边栏，也没有「今日营业」页签。点顶栏「营业概览」拉出清单，水果旁边写全称。往下滚是改之前的纯图标栏。</p>
    </header>
    <div class="stage">
      <section class="col">
        <h2>建议</h2>
        <p class="hint">内容铺满。点顶栏「营业概览」打开菜单；有子页的先展开，再点具体一页。</p>
        <div class="phone" id="phone-next"></div>
      </section>
      <section class="col">
        <h2>现在</h2>
        <p class="hint">图标栏一直占着宽度。蓝莓、石榴、樱桃要靠记，手机上点了也不出现名字。</p>
        <div class="phone" id="phone-now"></div>
      </section>
    </div>
  </div>

  <script>
    /** 与侧栏 OkfoodNavFruitIcon 同一套水果，色只留在小格里。 */
    const TINT = {
      blueberry: "#e7e9ff",
      pomegranate: "#ffe4e8",
      cherry: "#ffe0f3",
      banana: "#fff4cc",
      pitaya: "#f4e2ff",
      pear: "#dafaf0",
      apple: "#e3fbe6",
      orange: "#fff0dc",
      bayberry: "#ffe6dc",
      mangosteen: "#efe4ff",
    };

    const MODULES = [
      { id: "dash", fruit: "blueberry", label: "营业概览", page: "今日营业" },
      { id: "users", fruit: "pomegranate", label: "会员档案", page: "会员档案" },
      { id: "cards", fruit: "cherry", label: "开卡工单", page: "开卡工单" },
      { id: "orders", fruit: "banana", label: "订单管理", children: ["零售订单", "商城订单", "卡包订单"] },
      { id: "delivery", fruit: "pitaya", label: "配送管理", children: ["配送大表", "配送资质检验", "顺丰订单监控", "配送区域管理", "配送员管理"] },
      { id: "stats", fruit: "pear", label: "数据统计", children: ["会员统计", "财务统计"] },
      { id: "menu", fruit: "apple", label: "菜单管理", children: ["菜品管理", "本周菜单", "普通商品管理"] },
      { id: "stock", fruit: "orange", label: "库存管理", children: ["库存品类管理", "菜品用盒", "每份标配", "库存结存", "库存流水", "库存校对"] },
      { id: "marketing", fruit: "bayberry", label: "小程序营销", children: ["首页 Banner", "进入弹窗海报", "菜单页弹窗海报", "优惠券管理"] },
      { id: "system", fruit: "mangosteen", label: "系统管理", children: ["租户管理", "门店配置", "打印机管理", "打印设置"] },
    ];

    let svgSeq = 0;
    function fruitSvg(fruit) {
      const g = `${fruit}-${svgSeq++}`;
      const paths = {
        blueberry: `
          <defs>
            <radialGradient id="${g}-b1" cx="32%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#C9D4FF"/><stop offset="45%" stop-color="#6B7CFF"/><stop offset="100%" stop-color="#3A3AD4"/>
            </radialGradient>
            <radialGradient id="${g}-b2" cx="38%" cy="32%" r="60%">
              <stop offset="0%" stop-color="#D4DAFF"/><stop offset="50%" stop-color="#5B6AEE"/><stop offset="100%" stop-color="#3838C8"/>
            </radialGradient>
          </defs>
          <ellipse cx="19" cy="19" rx="8.5" ry="8" fill="url(#${g}-b1)"/>
          <ellipse cx="13" cy="21" rx="7" ry="6.8" fill="url(#${g}-b2)"/>
          <ellipse cx="15.5" cy="12" rx="2.2" ry="1.4" fill="#5CBF4A"/>
          <ellipse cx="20.5" cy="17" rx="2" ry="1.8" fill="#fff" opacity="0.35"/>`,
        pomegranate: `
          <defs>
            <radialGradient id="${g}-f" cx="35%" cy="28%" r="70%">
              <stop offset="0%" stop-color="#FF8A8E"/><stop offset="42%" stop-color="#C41E32"/><stop offset="100%" stop-color="#6E0E18"/>
            </radialGradient>
          </defs>
          <ellipse cx="16" cy="19" rx="11" ry="11" fill="url(#${g}-f)"/>
          <path d="M10 10 L16 6 L22 10 L20 13 L16 11 L12 13 Z" fill="#7a2030"/>
          <ellipse cx="11.5" cy="16" rx="2.5" ry="2" fill="#fff" opacity="0.28"/>`,
        cherry: `
          <defs>
            <radialGradient id="${g}-c" cx="35%" cy="30%" r="68%">
              <stop offset="0%" stop-color="#FFC8F0"/><stop offset="45%" stop-color="#E02088"/><stop offset="100%" stop-color="#880858"/>
            </radialGradient>
          </defs>
          <path d="M16 7 Q18 12 22 14 Q24 15 25 12" stroke="#3FA82A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <ellipse cx="12" cy="21" rx="6.5" ry="7" fill="url(#${g}-c)" transform="rotate(-8 12 21)"/>
          <ellipse cx="21" cy="22" rx="6.2" ry="6.8" fill="url(#${g}-c)" transform="rotate(10 21 22)"/>
          <ellipse cx="10" cy="18" rx="2" ry="1.8" fill="#fff" opacity="0.32"/>`,
        banana: `
          <defs>
            <linearGradient id="${g}-b" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFF4A8"/><stop offset="40%" stop-color="#FFE24A"/><stop offset="100%" stop-color="#F5B014"/>
            </linearGradient>
          </defs>
          <path d="M7 22 Q10 8 24 6 Q26 14 22 24 Q16 28 9 25 Q6 24 7 22 Z" fill="url(#${g}-b)"/>
          <ellipse cx="12" cy="14" rx="3" ry="2" fill="#fff" opacity="0.45"/>`,
        pitaya: `
          <defs>
            <radialGradient id="${g}-p" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#E8C8FF"/><stop offset="38%" stop-color="#B020D8"/><stop offset="100%" stop-color="#601098"/>
            </radialGradient>
          </defs>
          <ellipse cx="16" cy="20" rx="10" ry="12" fill="url(#${g}-p)"/>
          <path d="M8 12 L11 6 L14 11 L16 5 L18 11 L21 6 L24 12" fill="none" stroke="#4cba38" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="12" cy="17" rx="2.8" ry="2.2" fill="#fff" opacity="0.3"/>`,
        pear: `
          <defs>
            <radialGradient id="${g}-pe" cx="38%" cy="25%" r="72%">
              <stop offset="0%" stop-color="#D8FFF5"/><stop offset="42%" stop-color="#38D4A8"/><stop offset="100%" stop-color="#0A9070"/>
            </radialGradient>
          </defs>
          <path d="M16 9 Q22 11 22 18 Q22 26 16 28 Q10 26 10 18 Q10 11 16 9 Z" fill="url(#${g}-pe)"/>
          <ellipse cx="16" cy="8" rx="2" ry="3.5" fill="#5aaa38"/>
          <ellipse cx="13" cy="15" rx="3.5" ry="4" fill="#fff" opacity="0.25"/>`,
        apple: `
          <defs>
            <radialGradient id="${g}-a" cx="35%" cy="28%" r="68%">
              <stop offset="0%" stop-color="#C8FFC8"/><stop offset="38%" stop-color="#38C848"/><stop offset="100%" stop-color="#106820"/>
            </radialGradient>
          </defs>
          <path d="M16 8 C12 8 9 12 9 18 C9 24 12 28 16 28 C20 28 23 24 23 18 C23 12 20 8 16 8 Z" fill="url(#${g}-a)"/>
          <path d="M16 7 Q19 4 21 6" stroke="#3a9a28" stroke-width="2" fill="none" stroke-linecap="round"/>
          <ellipse cx="13" cy="15" rx="3.2" ry="4" fill="#fff" opacity="0.3"/>`,
        orange: `
          <defs>
            <radialGradient id="${g}-o" cx="38%" cy="30%" r="68%">
              <stop offset="0%" stop-color="#FFE8A8"/><stop offset="45%" stop-color="#FF9A28"/><stop offset="100%" stop-color="#E86008"/>
            </radialGradient>
          </defs>
          <circle cx="16" cy="18" r="11" fill="url(#${g}-o)"/>
          <path d="M16 7 Q14 4 11 5 Q13 8 16 9" fill="#4aaa28"/>
          <circle cx="12" cy="15" r="1.5" fill="#fff" opacity="0.35"/>`,
        bayberry: `
          <defs>
            <radialGradient id="${g}-y" cx="35%" cy="28%" r="70%">
              <stop offset="0%" stop-color="#FFE0C8"/><stop offset="42%" stop-color="#FF6840"/><stop offset="100%" stop-color="#C02810"/>
            </radialGradient>
          </defs>
          <ellipse cx="16" cy="19" rx="10" ry="10.5" fill="url(#${g}-y)"/>
          <circle cx="10" cy="14" r="2.2" fill="#FF8060"/>
          <circle cx="22" cy="15" r="2.2" fill="#E85838"/>
          <circle cx="16" cy="11" r="2" fill="#FFA078"/>
          <ellipse cx="13" cy="17" rx="2.8" ry="2.2" fill="#fff" opacity="0.28"/>`,
        mangosteen: `
          <defs>
            <radialGradient id="${g}-s" cx="38%" cy="30%" r="68%">
              <stop offset="0%" stop-color="#E4D0FF"/><stop offset="45%" stop-color="#9868E8"/><stop offset="100%" stop-color="#5828A8"/>
            </radialGradient>
          </defs>
          <ellipse cx="16" cy="20" rx="10.5" ry="10" fill="url(#${g}-s)"/>
          <path d="M8 14 L10 9 L13 12 L16 8 L19 12 L22 9 L24 14 Z" fill="#3aaa28"/>
          <ellipse cx="12.5" cy="17" rx="2.5" ry="2" fill="#fff" opacity="0.22"/>`,
      };
      return `<svg viewBox="0 0 32 32" aria-hidden="true">${paths[fruit] || ""}</svg>`;
    }

    function tile(fruit, on) {
      return `<span class="tile${on ? " on" : ""}" style="--tint:${TINT[fruit]}">${fruitSvg(fruit)}</span>`;
    }

    function mealCard(title, total, soldLabel, soldClass, parts, stats) {
      const legend = parts.map((p) => `<li><i class="dot ${p.dot}"></i>${p.name}<b>${p.n}</b></li>`).join("");
      const bars = parts.filter((p) => p.w).map((p) => `<i class="${p.bar}" style="width:${p.w}%"></i>`).join("");
      const statHtml = stats.map((s) => `<div class="stat ${s.kind || ""}"><span>${s.k}</span><b>${s.v}</b></div>`).join("");
      return `
        <article class="card">
          <div class="card-h">
            <span class="meal">${title}</span>
            <span class="tools"><span>上一日</span><span>下一日</span><span class="loss">报损耗</span></span>
          </div>
          <p class="kpi">后厨产出量：<strong>${total}</strong><em>份</em></p>
          <div class="bar-label"><span>${soldClass === "soft" ? "明日排产指标线" : "配额去向拆解线"}</span><span class="sold ${soldClass || ""}">${soldLabel}</span></div>
          <div class="bar">${bars}</div>
          <ul class="legend">${legend}</ul>
          <div class="split">${statHtml}</div>
        </article>`;
    }

    function dashboardHtml() {
      return `
        <div class="day">今日 <b>11月9日</b> 周一</div>
        ${mealCard("今日午餐 · 11月9日周一", 115, "已售出 115份", "", [
          { name: "配送", n: 106, dot: "d", bar: "a", w: 88 },
          { name: "自提", n: 1, dot: "p" },
          { name: "零售", n: 8, dot: "o", bar: "b", w: 8 },
          { name: "损耗", n: 0, dot: "r" },
          { name: "剩余", n: 0, dot: "g", bar: "c", w: 4 },
        ], [
          { k: "今日请假", v: 52 },
          { k: "当日过期", v: 5, kind: "warn" },
          { k: "暂停配送", v: 220 },
          { k: "同比上周", v: "-12", kind: "down" },
        ])}
        ${mealCard("今日晚餐 · 11月9日", 10, "已售出 10份", "", [
          { name: "配送", n: 8, dot: "d", bar: "a", w: 80 },
          { name: "自提", n: 0, dot: "p" },
          { name: "零售", n: 2, dot: "o", bar: "b", w: 20 },
          { name: "损耗", n: 0, dot: "r" },
          { name: "剩余", n: 0, dot: "g" },
        ], [])}
        <div class="day">明日 <b>11月10日</b> 周二</div>
        ${mealCard("明日午餐预测 · 11月10日周二", 130, "已售出 128份", "soft", [
          { name: "配送", n: 125, dot: "d", bar: "a", w: 90 },
          { name: "自提", n: 2, dot: "p" },
          { name: "零售", n: 1, dot: "o", bar: "b", w: 4 },
          { name: "损耗", n: 0, dot: "r" },
          { name: "剩余", n: 2, dot: "g", bar: "c", w: 6 },
        ], [])}`;
    }

    function railHtml() {
      return `<div class="rail">${MODULES.map((m, i) => tile(m.fruit, i === 0)).join("")}</div>`;
    }

    const phoneNow = document.getElementById("phone-now");
    phoneNow.innerHTML = `
      <div class="mesh"></div>
      <div class="screen">
        <div class="top">
          <div class="logo"></div>
          <button class="collapse-fake" type="button" aria-hidden="true">››</button>
          <span class="tab" style="margin-right:auto"><s></s>今日营业</span>
          <button class="bell" type="button" aria-hidden="true">🔔<i></i></button>
          <div class="clock"><b>18:03</b><span>11月9日</span></div>
          <div class="avatar">O</div>
        </div>
        <div class="body">
          <div class="with-rail">
            ${railHtml()}
            <div style="min-width:0;flex:1">${dashboardHtml()}<p class="rail-note">这一列没有文字</p></div>
          </div>
        </div>
      </div>`;

    const state = { moduleId: "dash", child: null, open: false, expanded: null };
    const phoneNext = document.getElementById("phone-next");

    function currentModule() {
      return MODULES.find((m) => m.id === state.moduleId);
    }

    function pageTitle() {
      return state.child || currentModule().page || currentModule().label;
    }

    function contentHtml() {
      if (state.moduleId === "dash" && !state.child) return dashboardHtml();
      const mod = currentModule();
      return `
        <section class="placeholder">
          <p class="eyebrow">${mod.label}</p>
          <h3>${pageTitle()}</h3>
          <p>预览只演示怎么过去。正式页面里的表格和数据不动，仍然从这扇菜单进来。</p>
        </section>`;
    }

    function sheetHtml() {
      return MODULES.map((m) => {
        const isLeafCurrent = state.moduleId === m.id && !state.child && !m.children;
        const parentOn = state.moduleId === m.id && !!m.children;
        const expanded = state.expanded === m.id;
        const kids = (m.children || []).map((name) => {
          const on = state.moduleId === m.id && state.child === name;
          return `<button type="button" class="child${on ? " current" : ""}" data-mod="${m.id}" data-child="${name}">${name}</button>`;
        }).join("");
        return `
          <button type="button" class="row${isLeafCurrent ? " current" : ""}${parentOn ? " parent-on" : ""}${expanded ? " expanded" : ""}" data-mod="${m.id}">
            ${tile(m.fruit)}
            <span class="label">${m.label}</span>
            ${m.children ? `<i class="subchev"></i>` : ""}
          </button>
          ${m.children ? `<div class="kids${expanded ? " show" : ""}">${kids}</div>` : ""}`;
      }).join("");
    }

    function renderNext() {
      const mod = currentModule();
      phoneNext.classList.toggle("show-sheet", state.open);
      phoneNext.innerHTML = `
        <div class="mesh"></div>
        <div class="screen">
          <div class="top">
            <div class="logo"></div>
            <button type="button" class="mod${state.open ? " open" : ""}" id="open-menu" aria-expanded="${state.open}">
              ${tile(mod.fruit)}
              <span class="name">${mod.label}</span>
              <i class="chev"></i>
            </button>
            <button class="bell" type="button" aria-hidden="true">🔔<i></i></button>
            <div class="clock"><b>18:03</b><span>11月9日</span></div>
            <div class="avatar">O</div>
          </div>
          <div class="body" id="next-body">${contentHtml()}</div>
        </div>
        <div class="scrim" id="scrim"></div>
        <div class="sheet" role="dialog" aria-label="菜单">
          <div class="handle"></div>
          <div class="sheet-h"><strong>去哪个模块</strong><button type="button" id="close-menu">关闭</button></div>
          <div class="sheet-list">${sheetHtml()}</div>
        </div>`;

      phoneNext.querySelector("#open-menu").addEventListener("click", () => {
        state.open = !state.open;
        if (state.open && currentModule().children) state.expanded = state.moduleId;
        renderNext();
      });
      phoneNext.querySelector("#scrim").addEventListener("click", () => {
        state.open = false;
        renderNext();
      });
      phoneNext.querySelector("#close-menu").addEventListener("click", () => {
        state.open = false;
        renderNext();
      });
      phoneNext.querySelectorAll(".row").forEach((btn) => {
        btn.addEventListener("click", () => {
          const modItem = MODULES.find((m) => m.id === btn.dataset.mod);
          if (modItem.children) {
            state.expanded = state.expanded === modItem.id ? null : modItem.id;
            state.open = true;
            renderNext();
            return;
          }
          state.moduleId = modItem.id;
          state.child = null;
          state.open = false;
          renderNext();
        });
      });
      phoneNext.querySelectorAll(".child").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.moduleId = btn.dataset.mod;
          state.child = btn.dataset.child;
          state.expanded = btn.dataset.mod;
          state.open = false;
          renderNext();
        });
      });
    }

    renderNext();
  </script>
</body>
</html>
