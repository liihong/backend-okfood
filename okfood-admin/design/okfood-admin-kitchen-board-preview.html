<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后厨出餐 · 电视看板</title>
  <!--
    电视一屏。成品图在中间，左边总出餐量，右边这一餐的每份净重。
    毛玻璃只用在顶栏和照片外框。临时可售、特殊餐、赠品、筷子小勺不在这屏。
  -->
  <style>
    :root {
      --canvas: #f7f6f3;
      --ink: #1d1f21;
      --muted: #5c6670;
      --faint: #8b949e;
      --line: rgba(29, 31, 33, 0.08);
      --accent: #e8927c;
      --accent-deep: #9a4e3c;
      --sans: "PingFang SC", "Hiragino Sans GB", "SF Pro Text", "Plus Jakarta Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      color: var(--ink);
      background:
        radial-gradient(520px 420px at -8% -10%, rgba(243, 193, 178, 0.55), transparent 70%),
        radial-gradient(480px 380px at 108% 18%, rgba(214, 228, 240, 0.7), transparent 70%),
        var(--canvas);
      font-family: var(--sans);
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    .review {
      height: 40px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.72);
      border-bottom: 1px solid rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px) saturate(1.2);
    }
    .review p { margin: 0; font-size: 12px; color: var(--muted); }
    .review strong { color: var(--ink); font-weight: 700; }
    .meals { display: flex; gap: 6px; }
    .meals button {
      height: 26px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); background: #fff; font-size: 12px; font-weight: 700;
    }
    .meals button.on { color: #fff; background: var(--accent); border-color: transparent; }

    .board {
      height: calc(100vh - 40px);
      width: min(calc(100vw - 20px), calc((100vh - 40px) * 16 / 9));
      margin: 0 auto;
      padding: 12px 0 14px;
      display: grid;
      grid-template-columns: 1fr 0.86fr 1.08fr;
      grid-template-rows: 72px minmax(0, 1fr);
      gap: 14px;
    }

    .mast {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 0 22px; border-radius: 20px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 10px 28px rgba(29, 31, 33, 0.05);
      backdrop-filter: blur(18px) saturate(1.25);
    }
    .day { margin: 0; font-size: 13px; font-weight: 650; color: var(--muted); }
    .dishline { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
    .dishline h1 {
      margin: 0; font-size: clamp(26px, 2.2vw, 34px); line-height: 1.05; font-weight: 680; letter-spacing: -0.03em;
    }
    .clock {
      margin: 0; font-size: clamp(30px, 2.6vw, 42px); line-height: 1; font-weight: 650;
      letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
    }

    .panel {
      min-height: 0; display: flex; flex-direction: column;
      border-radius: 24px; background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 16px 40px rgba(29, 31, 33, 0.06);
      overflow: hidden;
    }
    .panel-h {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 18px 0; font-size: 15px; font-weight: 750;
    }
    .panel-h i { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); flex: none; }
    .panel-h .sub { margin-left: auto; font-size: 12px; font-weight: 650; color: var(--faint); }

    .center { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    .hero {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 10px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 18px 40px rgba(29, 31, 33, 0.07);
      backdrop-filter: blur(16px) saturate(1.2);
    }
    .frame { position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden; background: #efeae4; }
    .frame img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
    .kicker {
      position: absolute; top: 12px; left: 12px;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.88); color: var(--ink);
      font-size: 13px; font-weight: 750;
      backdrop-filter: blur(10px);
    }
    .drink {
      flex: none;
      display: flex; align-items: center; gap: 12px;
      padding: 16px 18px; border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(29, 31, 33, 0.06);
    }
    .drink .k { font-size: 13px; font-weight: 750; color: #1d4f73; }
    .drink strong { font-size: clamp(22px, 1.8vw, 28px); font-weight: 720; letter-spacing: -0.03em; }
    .drink .tag { margin-left: auto; }
    .packs {
      flex: none;
      padding: 12px 12px 12px; border-radius: 20px; background: #fff;
      box-shadow: 0 16px 40px rgba(29, 31, 33, 0.06);
    }
    .packs .k {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; font-size: 13px; font-weight: 750;
    }
    .packs .k i { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); }
    .packs .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .packs .row.one { grid-template-columns: 1fr; }
    .packs article {
      min-width: 0; padding: 10px 12px; border-radius: 14px; background: #f7f6f3;
    }
    .packs .role { display: block; font-size: 12px; font-weight: 650; color: var(--muted); }
    .packs b {
      display: block; margin-top: 2px;
      font-size: clamp(20px, 1.6vw, 26px); font-weight: 720; letter-spacing: -0.03em;
    }
    .packs .n { display: block; margin-top: 2px; font-size: 13px; font-weight: 650; color: var(--faint); font-variant-numeric: tabular-nums; }

    .qty { padding: 16px 16px 14px; gap: 10px; }
    .qty .panel-h { padding: 0; }
    .qty .total { display: flex; align-items: baseline; gap: 8px; }
    .qty .total b {
      font-size: clamp(64px, 5.6vw, 92px); line-height: 0.84; font-weight: 720;
      letter-spacing: -0.055em; font-variant-numeric: tabular-nums;
    }
    .qty .total small { font-size: 16px; font-weight: 650; color: var(--muted); }
    .splits {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px;
    }
    .splits article {
      min-height: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 12px 16px; border-radius: 16px; background: #f7f6f3;
    }
    .splits span { font-size: 14px; font-weight: 650; color: var(--muted); }
    .splits b {
      margin-top: 4px;
      font-size: clamp(36px, 3.2vw, 52px); line-height: 1; font-weight: 720;
      letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
    }
    .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .flow span {
      padding: 10px 6px; border-radius: 14px; background: #f7f6f3;
      font-size: 14px; font-weight: 750; text-align: center;
    }
    .flow em { display: block; font-style: normal; font-size: 11px; font-weight: 700; color: var(--accent-deep); }

    .meal ul {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr;
      margin: 12px 14px 0; padding: 0; list-style: none; gap: 8px;
    }
    .meal ul.cols { grid-template-columns: 1fr 1fr; gap: 8px; }
    .meal li {
      min-height: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px; border-radius: 16px; background: #f7f6f3;
    }
    .meal .name { font-size: clamp(16px, 1.25vw, 22px); font-weight: 720; }
    .meal ul.cols .name { font-size: clamp(15px, 1.1vw, 18px); }
    .meal b {
      margin-left: auto; font-size: clamp(26px, 2.2vw, 40px); font-weight: 720;
      letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
    }
    .meal ul.cols b { font-size: clamp(22px, 1.7vw, 30px); }
    .meal small { width: 1.6em; font-size: 14px; font-weight: 650; color: var(--muted); }
    .hint { margin: 10px 16px 14px; font-size: 13px; line-height: 1.45; color: var(--muted); }

    .tag {
      display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px;
      background: #f3f1ee; color: #5c6670;
      font-style: normal; font-size: 12px; font-weight: 750; white-space: nowrap;
    }
    .tag.ok { background: #e7f6ee; color: #1f8a5b; }
    .tag.mild { background: #fff1ea; color: #9a4e3c; }
    .tag.base { background: #fff; color: var(--accent-deep); }
    .tag.cold { background: #d7e7f4; color: #1d4f73; }
  </style>
</head>
<body>
  <div class="review">
    <p><strong>后厨出餐</strong> · 成品在中间，两边是出餐量和每份净重。</p>
    <div class="meals" id="meals">
      <button type="button" data-meal="lunch" class="on">午餐</button>
      <button type="button" data-meal="dinner">晚餐</button>
    </div>
  </div>
  <main class="board" id="board"></main>
  <script>
    const meals = {
      lunch: {
        label: "午餐",
        date: "11月11日 周三",
        photo: "meal-preview-lunch-today.jpg",
        dish: "照烧鸡块饭",
        spice: "不辣",
        portions: 130,
        splits: [["配送", 102], ["自提", 18], ["销售", 8], ["剩余", 2]],
        drink: { name: "柠檬气泡", temp: "冷" },
        packs: [["900圆", "餐盒"], ["赠饮瓶", "装随餐饮"]],
        items: [
          ["藜麦饭", "120", "克", "打底"],
          ["鸡块", "120", "克", ""],
          ["胡萝卜", "40", "克", ""],
          ["西兰花", "80", "克", ""],
          ["南瓜", "50", "克", ""],
          ["玉米", "30", "克", ""],
          ["番茄", "40", "克", ""],
          ["香菇", "25", "克", ""],
          ["木耳", "20", "克", ""],
          ["鸡蛋", "50", "克", ""],
        ],
      },
      dinner: {
        label: "晚餐",
        date: "11月11日 周三",
        photo: "meal-preview-dinner-today.jpg",
        dish: "黑椒牛柳藜麦碗",
        spice: "微辣",
        portions: 86,
        splits: [["配送", 72], ["自提", 10], ["销售", 4], ["剩余", 0]],
        drink: null,
        packs: [["900圆", "餐盒"]],
        items: [
          ["紫薯", "120", "克", "打底"],
          ["彩椒", "40", "克", ""],
          ["菜心", "50", "克", ""],
          ["牛柳", "140", "克", ""],
        ],
      },
    }

    let mealKey = "lunch"

    function tag(text, kind) {
      return `<em class="tag ${kind}">${text}</em>`
    }

    function render() {
      const meal = meals[mealKey]
      document.querySelectorAll("#meals button").forEach((button) => {
        button.classList.toggle("on", button.dataset.meal === mealKey)
        button.onclick = () => {
          mealKey = button.dataset.meal
          render()
        }
      })
      const spiceKind = meal.spice === "微辣" ? "mild" : "ok"
      const drink = meal.drink
        ? `<section class="drink"><span class="k">随餐饮</span><strong>${meal.drink.name}</strong>${tag(meal.drink.temp, "cold")}</section>`
        : ""
      document.getElementById("board").innerHTML = `
        <header class="mast">
          <div>
            <p class="day">${meal.date} · ${meal.label}</p>
            <div class="dishline"><h1>${meal.dish}</h1>${tag(meal.spice, spiceKind)}</div>
          </div>
          <p class="clock" id="clock">--:--:--</p>
        </header>
        <section class="panel qty">
          <div class="panel-h"><i></i>总出餐量<span class="sub">按这个数摆盒</span></div>
          <div class="total"><b>${meal.portions}</b><small>份</small></div>
          <div class="splits">
            ${meal.splits.map((item) => `<article><span>${item[0]}</span><b>${item[1]}</b></article>`).join("")}
          </div>
          <div class="flow">
            <span><em>1</em>摆盒</span>
            <span><em>2</em>装入</span>
            <span><em>3</em>扣盖装袋</span>
          </div>
        </section>
        <div class="center">
          <section class="hero">
            <div class="frame">
              <img src="${meal.photo}" alt="${meal.dish}" />
              <span class="kicker">成品</span>
            </div>
          </section>
          ${drink}
          <section class="packs">
            <div class="k"><i></i>打包配材</div>
            <div class="row ${meal.packs.length > 1 ? "" : "one"}">
              ${meal.packs.map((item) => `<article><span class="role">${item[1]}</span><b>${item[0]}</b><span class="n">× ${meal.portions}</span></article>`).join("")}
            </div>
          </section>
        </div>
        <section class="panel meal">
          <div class="panel-h"><i></i>这一餐<span class="sub">每份净重</span></div>
          <ul class="${meal.items.length > 5 ? "cols" : ""}">
            ${meal.items.map((row) => `
              <li>
                <span class="name">${row[0]}</span>
                ${row[3] ? tag(row[3], "base") : ""}
                <b>${row[1]}</b><small>${row[2]}</small>
              </li>
            `).join("")}
          </ul>
          <p class="hint">净重是一份的量。放几个对着这个数自己看，先熟的先放，摆完和中间的图对上。</p>
        </section>`
      tick()
    }

    function pad(value) {
      return String(value).padStart(2, "0")
    }

    function tick() {
      const clock = document.getElementById("clock")
      if (!clock) return
      const now = new Date()
      clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`
    }

    render()
    setInterval(tick, 1000)
  </script>
</body>
</html>
