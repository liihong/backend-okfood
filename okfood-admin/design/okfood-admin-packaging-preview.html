<!DOCTYPE html>
<html lang="zh-CN" data-theme="primary-iris">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>库存管理 · 讨论预览</title>
  <style>
    :root { --p: #8b7ec8; --mesh-a: rgba(210, 200, 255, 0.55); --mesh-b: rgba(230, 215, 255, 0.45); }
    [data-theme="primary-peach"] { --p: #e8927c; --mesh-a: rgba(255, 200, 185, 0.55); --mesh-b: rgba(255, 225, 210, 0.45); }
    [data-theme="primary-mojito"] { --p: #5cbf8e; --mesh-a: rgba(190, 245, 215, 0.55); --mesh-b: rgba(215, 235, 255, 0.5); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #1d1f21; background: #f7fafb;
      font-family: "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .mesh { position: fixed; inset: 0; pointer-events: none; }
    .mesh i { position: absolute; border-radius: 50%; filter: blur(60px); }
    .mesh i:first-child { width: 420px; height: 420px; left: -80px; top: -60px; background: var(--mesh-a); }
    .mesh i:last-child { width: 360px; height: 360px; right: -40px; bottom: -80px; background: var(--mesh-b); }
    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 18px; background: rgba(255,255,255,.72);
      border-bottom: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(14px);
    }
    .bar strong { font-size: 13px; white-space: nowrap; }
    .themes, .scenes { display: flex; gap: 6px; flex-wrap: wrap; }
    .themes button, .scenes button, .ghost, .primary, .link, .danger {
      border: 1px solid rgba(0,0,0,.06); background: #fff; border-radius: 999px;
      padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer;
    }
    .themes button.on, .scenes button.on, .primary { color: #fff; background: var(--p); border-color: transparent; }
    .page { position: relative; max-width: 1180px; margin: 0 auto; padding: 18px 18px 48px; }
    .note, .hint {
      margin: 0 0 14px; padding: 12px 14px; border-radius: 16px;
      background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.82);
      color: #5c6670; font-size: 13px; line-height: 1.55;
    }
    .hint.warn { background: #fff7ed; color: #9a3412; border-color: #fed7aa; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .kicker { margin: 0 0 4px; font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--p); }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
    .intro { margin: 6px 0 0; max-width: 46rem; color: #5c6670; font-size: 13px; line-height: 1.55; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .card {
      padding: 14px; border-radius: 22px; background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 14px 36px rgba(25,45,55,.06);
    }
    .filters { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 10px; margin-bottom: 12px; }
    .filters label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
    input, select {
      height: 36px; border-radius: 10px; border: 1px solid #e6eaee; padding: 0 10px; background: #fff; font: inherit;
    }
    .table-wrap { border-radius: 16px; overflow: auto; background: #fff; border: 1px solid rgba(15,23,42,.06); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 12px; color: #fff; background: var(--p); padding: 10px 12px; white-space: nowrap; }
    td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .tag--ok { background: #ecfdf3; color: #15803d; }
    .tag--wait { background: #fff7ed; color: #c2410c; }
    .tag--bad { background: #fef2f2; color: #b91c1c; }
    .tag--muted { background: #f1f5f9; color: #64748b; }
    .link { border: 0; background: transparent; color: var(--p); padding: 0 8px 0 0; }
    .danger { border: 0; background: transparent; color: #dc2626; padding: 0; }
    .lines { display: flex; flex-direction: column; gap: 8px; }
    .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .unit { color: #5c6670; font-size: 13px; }
    .mask { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(15,23,42,.35); }
    .mask.show { display: flex; }
    .dlg { width: min(640px, calc(100vw - 32px)); border-radius: 22px; background: #fff; box-shadow: 0 18px 48px rgba(25,45,55,.16); }
    .dlg header, .dlg footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
    .dlg header { border-bottom: 1px solid rgba(15,23,42,.06); }
    .dlg footer { justify-content: flex-end; gap: 8px; border-top: 1px solid rgba(15,23,42,.06); }
    .dlg h3 { margin: 0; font-size: 16px; }
    .dlg .body { padding: 16px 18px; }
    .form { display: grid; gap: 10px; }
    .form label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
    .switch { font-weight: 600; color: #334155; }
    @media (max-width: 900px) { .bar, .head { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
  <div class="mesh"><i></i><i></i></div>
  <div class="bar">
    <strong>库存管理六页 · 讨论预览（不改正式代码）</strong>
    <div class="scenes" id="scenes"></div>
    <div class="themes">
      <button type="button" data-theme="primary-iris" class="on">雾紫</button>
      <button type="button" data-theme="primary-peach">蜜桃珊瑚</button>
      <button type="button" data-theme="primary-mojito">莫吉托</button>
    </div>
  </div>
  <main class="page">
    <p class="note">六页共用同一套壳：页头说明放标题下，主操作放右侧，表格白底。提示文案、字段和按钮都按现在的页面保留，只换外观。点「新增品类」「设置」「入库」可以核对弹窗。</p>
    <div class="head">
      <div>
        <p class="kicker">库存管理</p>
        <h1 id="title">库存品类管理</h1>
        <p class="intro" id="intro"></p>
      </div>
      <div class="actions" id="actions"></div>
    </div>
    <div id="stage"></div>
  </main>
  <div class="mask" id="mask">
    <div class="dlg" role="dialog">
      <header><h3 id="dlgTitle">新增耗材</h3><button class="ghost" type="button" id="dlgClose">关闭</button></header>
      <div class="body" id="dlgBody"></div>
      <footer>
        <button class="ghost" type="button" id="dlgCancel">取消</button>
        <button class="primary" type="button" id="dlgSave">保存</button>
      </footer>
    </div>
  </div>
  <script>
    const scenes = [
      ['sku', '库存品类管理'],
      ['boxes', '菜品用盒'],
      ['standard', '每份标配'],
      ['stock', '库存结存'],
      ['ledger', '库存流水'],
      ['stocktake', '库存校对'],
    ]
    const copy = {
      sku: {
        title: '库存品类管理',
        intro: '打包袋全店只能有一个，晚上按每餐出餐份数自动扣一只。最低库存留空则不提醒采购，结存变成负数时仍会通知。',
      },
      boxes: {
        title: '菜品用盒',
        intro: '这里是菜品默认用盒。本周某一天要换盒子，请在本周菜单点「用盒」，那一次会同时改当天槽位和默认值。',
      },
      standard: {
        title: '每份标配',
        intro: '筷子、小勺这类每份都有的东西设一次即可。午餐和晚餐会各乘各的后厨出餐份数。打包袋不要放这里。',
      },
      stock: {
        title: '库存结存',
        intro: '低于最低库存：沙拉盒、打包袋。没有低库存时，这里改回「未盘点的结存显示为 0，晚上不会扣」。',
      },
      ledger: {
        title: '库存流水',
        intro: '按耗材和业务日查看入库、自动领用、期初和盘点。类型文案保持：期初、入库、自动领用、盘点。',
      },
      stocktake: {
        title: '库存校对',
        intro: '每周把仓库里的实数填在右边。没填的行不会改。第一次填写会当作期初，之后晚上才会扣这个品。',
      },
    }

    function tag(text, kind) {
      return `<span class="tag tag--${kind}">${text}</span>`
    }
    function table(headers, rows) {
      const head = headers.map((h) => `<th>${h}</th>`).join('')
      const body = rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join('')}</tr>`).join('')
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`
    }
    function lineEditor(lines) {
      const rows = lines.map(([name, qty]) => `
        <div class="line">
          <select><option>${name}</option><option>沙拉盒</option><option>料汁杯</option><option>筷子</option><option>小勺</option></select>
          <input type="number" value="${qty}" style="width:88px" />
          <span class="unit">每份</span>
          <button class="danger" type="button">移除</button>
        </div>`).join('')
      return `<div class="lines">${rows}<div><button class="ghost" type="button">添加耗材</button></div></div>`
    }

    const views = {
      sku() {
        return table(
          ['名称', '用途', '供应商', '单位', '最低库存', '角色', '状态', '操作'],
          [
            ['沙拉盒', '沙拉', '新乡包材', '个', '100', '普通', tag('启用', 'ok'), `<button class="link" data-dlg="sku-edit" type="button">编辑</button><button class="danger" type="button">删除</button>`],
            ['料汁杯', '料汁', '新乡包材', '个', '80', '普通', tag('启用', 'ok'), `<button class="link" data-dlg="sku-edit" type="button">编辑</button><button class="danger" type="button">删除</button>`],
            ['打包袋', '每餐一只', '新乡包材', '只', '未设置', tag('每餐打包袋', 'wait'), tag('启用', 'ok'), `<button class="link" data-dlg="sku-edit" type="button">编辑</button><button class="danger" type="button">删除</button>`],
            ['筷子', '每份', '新乡包材', '双', '200', '普通', tag('启用', 'ok'), `<button class="link" data-dlg="sku-edit" type="button">编辑</button><button class="danger" type="button">删除</button>`],
          ]
        )
      },
      boxes() {
        return table(
          ['菜品', '状态', '默认用盒', '操作'],
          [
            ['鸡胸肉沙拉', tag('启用', 'ok'), '沙拉盒×1、料汁杯×1', `<button class="link" data-dlg="box" type="button">设置</button>`],
            ['金枪鱼能量碗', tag('启用', 'ok'), tag('未设置', 'wait'), `<button class="link" data-dlg="box" type="button">设置</button>`],
            ['果蔬汁1日体验', tag('停用', 'muted'), '—', `<button class="link" data-dlg="box" type="button">设置</button>`],
          ]
        )
      },
      standard() {
        return lineEditor([['筷子', 1], ['小勺', 1]]) + `<p class="intro" style="margin-top:10px">打包袋不会出现在这里的耗材选项里。</p>`
      },
      stock() {
        return `<p class="hint warn">低于最低库存：沙拉盒、打包袋</p>` + table(
          ['名称', '用途', '供应商', '结存', '最低库存', '角色', '操作'],
          [
            ['沙拉盒', '沙拉', '新乡包材', tag('86 个', 'bad'), '100', '—', `<button class="link" data-dlg="in" type="button">入库</button>`],
            ['料汁杯', '料汁', '新乡包材', '240 个', '80', '—', `<button class="link" data-dlg="in" type="button">入库</button>`],
            ['打包袋', '每餐一只', '新乡包材', tag('12 只', 'bad'), '未设置', tag('每餐打包袋', 'wait'), `<button class="link" data-dlg="in" type="button">入库</button>`],
            ['筷子', '每份', '新乡包材', `0 双 ${tag('未盘点', 'muted')}`, '200', '—', `<button class="link" data-dlg="in" type="button">入库</button>`],
          ]
        )
      },
      ledger() {
        return `<div class="filters">
            <label>耗材 <select><option>全部</option><option>沙拉盒</option><option>打包袋</option></select></label>
            <label>从 <input type="date" value="2026-11-01" /></label>
            <label>到 <input type="date" value="2026-11-10" /></label>
            <button class="primary" type="button">查询</button>
          </div>` + table(
          ['业务日', '耗材', '类型', '餐段', '变动', '结存', '操作人', '备注'],
          [
            ['2026-11-10', '沙拉盒', '自动领用', '晚餐', '-18', '86', '系统', '后厨出餐'],
            ['2026-11-10', '打包袋', '自动领用', '午餐', '-22', '12', '系统', '每餐一只'],
            ['2026-11-09', '料汁杯', '入库', '—', '+200', '240', 'okfood', '采购入库'],
            ['2026-11-08', '筷子', '期初', '—', '+500', '500', 'okfood', '期初盘点'],
            ['2026-11-07', '沙拉盒', '盘点', '—', '-4', '104', 'okfood', '每周校对'],
          ]
        )
      },
      stocktake() {
        return table(
          ['名称', '供应商', '系统结存', '实盘'],
          [
            ['沙拉盒', '新乡包材', '86', '<input placeholder="不填则不改" style="width:140px" />'],
            ['料汁杯', '新乡包材', '240', '<input placeholder="不填则不改" style="width:140px" />'],
            ['打包袋', '新乡包材', '12', '<input placeholder="不填则不改" style="width:140px" />'],
            ['筷子', '新乡包材', '未期初', '<input placeholder="不填则不改" value="480" style="width:140px" />'],
          ]
        )
      },
    }

    const headerActions = {
      sku: `<button class="primary" type="button" data-dlg="sku-new">新增品类</button><button class="ghost" type="button">导入常用打包耗材</button>`,
      boxes: '',
      standard: `<button class="primary" type="button">保存标配</button>`,
      stock: '',
      ledger: '',
      stocktake: `<button class="primary" type="button">保存校对</button>`,
    }

    const dialogs = {
      'sku-new': {
        title: '新增耗材',
        save: '保存',
        body: `<div class="form">
          <label>名称<input value="" placeholder="耗材名称" /></label>
          <label>用途<input placeholder="如沙拉、料汁" /></label>
          <label>供应商<input /></label>
          <label>单位<input value="个" /></label>
          <label class="switch">最低库存 <span>不提醒 / 设置</span></label>
          <label class="switch">每餐打包袋 <input type="checkbox" /></label>
        </div>`,
      },
      'sku-edit': {
        title: '编辑耗材',
        save: '保存',
        body: `<div class="form">
          <label>名称<input value="沙拉盒" /></label>
          <label>用途<input value="沙拉" /></label>
          <label>供应商<input value="新乡包材" /></label>
          <label>单位<input value="个" /></label>
          <label>最低库存<input type="number" value="100" /></label>
          <label class="switch">每餐打包袋 <input type="checkbox" /></label>
          <label class="switch">启用 <input type="checkbox" checked /></label>
        </div>`,
      },
      box: {
        title: '鸡胸肉沙拉 的用盒',
        save: '保存',
        body: lineEditor([['沙拉盒', 1], ['料汁杯', 1]]),
      },
      in: {
        title: '采购入库',
        save: '确认入库',
        body: `<div class="form">
          <label>数量<input type="number" value="1" min="1" /></label>
          <label>备注<input maxlength="200" placeholder="选填" /></label>
        </div>`,
      },
    }

    let sceneKey = 'sku'
    const stage = document.getElementById('stage')
    const scenesEl = document.getElementById('scenes')
    scenesEl.innerHTML = scenes.map(([key, name]) =>
      `<button type="button" data-scene="${key}" class="${key === 'sku' ? 'on' : ''}">${name}</button>`
    ).join('')

    function render() {
      const meta = copy[sceneKey]
      document.getElementById('title').textContent = meta.title
      document.getElementById('intro').textContent = meta.intro
      document.getElementById('actions').innerHTML = headerActions[sceneKey]
      stage.innerHTML = `<section class="card">${views[sceneKey]()}</section>`
    }

    function openDlg(key) {
      const dlg = dialogs[key]
      if (!dlg) return
      document.getElementById('dlgTitle').textContent = dlg.title
      document.getElementById('dlgBody').innerHTML = dlg.body
      document.getElementById('dlgSave').textContent = dlg.save
      document.getElementById('mask').classList.add('show')
    }
    function closeDlg() { document.getElementById('mask').classList.remove('show') }

    document.body.addEventListener('click', (event) => {
      const sceneBtn = event.target.closest('[data-scene]')
      if (sceneBtn) {
        sceneKey = sceneBtn.dataset.scene
        scenesEl.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === sceneBtn))
        render()
        return
      }
      const dlgBtn = event.target.closest('[data-dlg]')
      if (dlgBtn) openDlg(dlgBtn.dataset.dlg)
    })
    document.querySelectorAll('.themes button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.documentElement.dataset.theme = btn.dataset.theme
        document.querySelectorAll('.themes button').forEach((b) => b.classList.toggle('on', b === btn))
      })
    })
    document.getElementById('dlgClose').addEventListener('click', closeDlg)
    document.getElementById('dlgCancel').addEventListener('click', closeDlg)
    document.getElementById('dlgSave').addEventListener('click', closeDlg)
    render()
  </script>
</body>
</html>
